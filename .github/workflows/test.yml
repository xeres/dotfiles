name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          bats-version: 1.13.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Install chezmoi and apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.local/share
          ln -s "$GITHUB_WORKSPACE" ~/.local/share/chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin apply --exclude=encrypted
      - name: "[TEMP DIAG] background processes left by zsh -i"
        run: |
          set -x
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          zsh -i -c 'whence zinit' </dev/null >/dev/null 2>&1 || true
          sleep 2
          pgrep -fl 'op daemon' || echo "no op daemon"
          for p in $(pgrep -f 'op daemon'); do ps -o pid,ppid,etime,command -p "$p" || true; lsof -nP -p "$p" | grep -v -E 'txt|cwd|DIR|KQUEUE|PSXSHM|\.dylib' || true; done
          op --version || true
      - name: Run tests
        run: ~/.local/share/chezmoi/scripts/run_test.bash
