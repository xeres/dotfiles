name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          bats-version: 1.13.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Install chezmoi and apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.local/share
          ln -s "$GITHUB_WORKSPACE" ~/.local/share/chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin apply --exclude=encrypted
      - name: "[TEMP DIAG] who holds the bats pipe"
        run: |
          set +e
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          echo "### bats shell.bats (45s alarm)"
          perl -e 'alarm shift; exec @ARGV' 45 bats ~/.local/share/chezmoi/test/common/shell.bats; echo "bats exit=$?"
          echo "### leftover processes (non-system)"
          ps -axo pid,ppid,user,etime,command | grep -E "^ *[0-9]+ +[0-9]+ +runner" | grep -v -E "/System/|/usr/libexec|/usr/sbin|Veertu|/Library/|hca|grep|ps -axo"
          echo "### fds of leftover bats/zsh/op/mise/herdr/starship/uv/gh processes"
          for p in $(pgrep -f 'bats|zsh|op daemon|mise|herdr|starship|uv|gh |lazygit'); do echo "--- pid $p: $(ps -o command= -p $p)"; lsof -nP -p "$p" 2>/dev/null | grep -v -E "txt|cwd|DIR|KQUEUE|PSXSHM|\.dylib|rtd"; done
          echo "### all runner PIPE fds"; lsof -nP -u "$(id -un)" 2>/dev/null | grep -E "PIPE|FIFO" | grep -v -E "Runner|Listener|hosted-compute|CoreSimulator"
          echo "### kill leftovers so Run tests can proceed"; pkill -f 'op daemon'; pkill -f bats-exec; true
      - name: Run tests
        run: ~/.local/share/chezmoi/scripts/run_test.bash
